name: hermes-prime-bridge
version: 0.2.0
description: "Bridge plugin porting Prime Agent's persistent IPython kernel control-plane (pk_kernel) and continual harness (pk_harness / pk_refine) onto Hermes as the native stateful Python execution path."
author: "bridge"
kind: standalone

provides_tools:
  - pk_kernel_exec
  - pk_harness_get
  - pk_refine
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_reset
