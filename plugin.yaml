name: hermes-prime-bridge
version: 0.1.0
description: "Bridge plugin porting Prime Agent's persistent IPython kernel control-plane (pk_kernel), continual harness (pk_harness/pk_refine), and RLM call ergonomics onto Hermes -- replacing stateless PTC and behind-delegate verbosity without redundant backends."
author: "bridge"
kind: standalone

provides_tools:
  - pk_kernel_exec
  - pk_harness_get
  - pk_refine
  - rlm
  - rlm_list
  - rlm_get
  - rlm_delete
provides_hooks:
  - on_session_end
  - on_session_reset
provides_skills:
  - pk-python
