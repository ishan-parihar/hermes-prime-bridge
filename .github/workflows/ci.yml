name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    name: pytest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install uv
          uv sync --frozen 2>/dev/null || uv sync
      - name: Test
        run: uv run pytest -q
