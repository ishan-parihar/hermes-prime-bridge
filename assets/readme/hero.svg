<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">hermes-prime-bridge — a live-upstream Prime plugin for Hermes Agent</title>
  <desc id="h-desc">Split hero: left is the project name and value; right is a bridge map joining Hermes Agent to live Prime Agent source, with a hermes doctor proof terminal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8bf5"/><stop offset="1" stop-color="#2b64c8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="398" fill="none" stroke="#26303a" stroke-width="1.5" rx="14"/>

  <!-- ============ LEFT: TITLE ============ -->
  <g transform="translate(58 52)">
    <rect y="2" width="7" height="24" rx="3" fill="#4c8bf5"/>
    <text x="22" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#8fa2b5" letter-spacing="3">HERMES AGENT · PLUGIN</text>

    <text x="0" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="60" fill="#eef1f4" letter-spacing="-1.5">hermes-prime-bridge</text>

    <text x="0" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="400" font-size="25" fill="#b9c2cc" xml:space="preserve">Prime Agent&apos;s persistent kernel, continual harness,</text>
    <text x="0" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="400" font-size="25" fill="#b9c2cc" xml:space="preserve">and lean subagent calls — live-sourced straight off</text>
    <text x="0" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="400" font-size="25" fill="#b9c2cc" xml:space="preserve">Prime Agent, into Hermes. Replaces, not duplicates.</text>

    <!-- meta chips -->
    <g transform="translate(0,246)">
      <rect x="0" y="0" width="118" height="34" rx="8" fill="#161d26" stroke="#2a3440"/>
      <text x="59" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8fa2b5" text-anchor="middle">v0.1.0</text>
      <rect x="128" y="0" width="196" height="34" rx="8" fill="#161d26" stroke="#2a3440"/>
      <text x="226" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8fa2b5" text-anchor="middle">live vendor prime-agent</text>
      <rect x="334" y="0" width="118" height="34" rx="8" fill="#161d26" stroke="#2a3440"/>
      <text x="393" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8fa2b5" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- ============ RIGHT: BRIDGE MAP ============ -->
  <g transform="translate(700,48)">
    <text x="0" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#66788a" letter-spacing="1">HOW IT CONNECTS</text>

    <!-- host node (Hermes) -->
    <rect x="0" y="48" width="176" height="66" rx="10" fill="#161d26" stroke="#3a4754"/>
    <text x="88" y="78" font-family="-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="20" fill="#eef1f4" text-anchor="middle">Hermes Agent</text>
    <text x="88" y="102" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6f8192" text-anchor="middle">pk_kernel · /harness</text>

    <!-- live vendor node (Prime) -->
    <rect x="326" y="48" width="172" height="66" rx="8" fill="#10151b" stroke="#2b64c8"/>
    <text x="412" y="78" font-family="-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="20" fill="#cfe0ff" text-anchor="middle">Prime Agent</text>
    <text x="412" y="102" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#7f9ad1" text-anchor="middle">live vendor · 87e7a7f1</text>

    <!-- the connecting span -->
    <rect x="176" y="78" width="150" height="6" rx="3" fill="url(#bar)"/>
    <circle cx="176" cy="81" r="7" fill="#0f141b" stroke="#4c8bf5" stroke-width="2"/>
    <circle cx="326" cy="81" r="7" fill="#0f141b" stroke="#4c8bf5" stroke-width="2"/>

    <!-- proof terminal -->
    <rect x="0" y="150" width="458" height="212" rx="12" fill="#0d1117" stroke="#2c3440"/>
    <rect x="12" y="14" width="10" height="10" rx="3" fill="#4c8bf5"/>
    <text x="229" y="23" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6b7c8c" text-anchor="middle">hermes doctor</text>
    <g transform="translate(20,54)" font-family="ui-monospace,Menlo,monospace" font-size="16">
      <text x="0" y="0" fill="#9aa7b3">$ ./scripts/install.sh</text>
      <text x="0" y="26" fill="#4aa96c">✓ plugin enabled (git)</text>
      <text x="0" y="52" fill="#4aa96c">✓ prime_kernel toolset live</text>
      <text x="0" y="78" fill="#4aa96c">✓ vendor prime-agent @ 87e7a7f1</text>
      <text x="0" y="104" fill="#8fa2b5">$ hermes doctor → RC 0</text>
      <text x="0" y="130" fill="#9aa7b3">$ </text>
      <rect x="20" y="126" width="9" height="16" fill="#4c8bf5"/>
    </g>
  </g>
</svg>