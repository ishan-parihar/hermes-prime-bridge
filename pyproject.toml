
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-prime-bridge"
version = "0.1.0"
description = "Bridge plugin bringing prime-agent's persistent kernel, harness, and RLM ergonomics into Hermes Agent"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = []

dependency-groups = {dev = ["pytest>=8"]}

[project.entry-points."hermes_agent.plugins"]
hermes-prime-bridge = "bridge:register"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]


[tool.pytest.ini_options]
# Hermes directory plugins require a root __init__.py (re-exporting register),
# so pytest must import test modules via their own basename rather than treating
# the repo root as a package (which would try to import that root __init__.py).
testpaths = ["tests"]
addopts = "--import-mode=importlib"

